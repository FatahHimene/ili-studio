<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in · ili studio</title>
  <link rel="icon" href="/_ili/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/_ili/app.css" />
  <link rel="stylesheet" href="/_ili/auth.css" />
</head>
<body class="grid-bg">
  <form class="card" method="post" action="/login">
    <span class="logo"><span class="i"><span class="cur"></span>ı</span>li studio</span>
    <div><span class="label">Welcome back</span><h1>Sign in</h1></div>
    <p class="err" id="err" hidden></p>
    <label class="field"><span>Email</span><input class="input" type="text" name="email" id="email" autocomplete="username" inputmode="email" required autofocus /></label>
    <label class="field"><span>Password</span><input class="input" type="password" name="password" autocomplete="current-password" required /></label>
    <input type="hidden" name="next" id="next" />
    <button class="btn btn-primary" type="submit">Sign in →</button>
    <p class="alt">New to ili studio? <a href="/signup">Create your free account</a></p>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('error')) { const el = document.getElementById('err'); el.textContent = q.get('error'); el.hidden = false; }
    if (q.get('deleted')) { const el = document.getElementById('err'); el.textContent = 'Your account and all your sites have been deleted. Thank you for trying ili studio.'; el.style.cssText = 'background:#F4FBDC;color:#16181d;border-color:#9bbf1f'; el.hidden = false; }
    if (q.get('email')) document.getElementById('email').value = q.get('email');
    if (q.get('next') === 'seo') { document.getElementById('next').value = 'seo'; document.querySelector('.alt a').href = '/signup?next=seo'; }
  </script>
</body>
</html>
